<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TasteWalk — Walking Guide That Learns Your Taste</title>
  <meta name="description" content="A walking guide that learns your taste as you walk: tap yes or no on each place, snap a photo and post it straight to Instagram." />
  <meta name="theme-color" content="#0d1220" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👟</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="map"></div>

  <header class="top">
    <div class="brand">TasteWalk</div>
    <div class="top-right">
      <span class="chip" id="envChip">—</span>
      <div class="mode" id="modeToggle" role="tablist">
        <button data-mode="sim" class="on" title="Simulated walk">Demo</button>
        <button data-mode="gps" title="Use your real location">GPS</button>
      </div>
    </div>
  </header>

  <button class="recenter" id="recenterBtn" title="Follow me">◎</button>

  <!-- the place you're at / tapped — floats left on desktop, above the dock on phones -->
  <section class="card" id="card" hidden>
    <button class="card-close" id="cardClose" title="Close">✕</button>
    <img class="stop-img" id="stopImg" alt="" hidden />
    <div class="card-body">
      <button class="link back" id="backBtn" hidden>← Back to your next stop</button>
      <p class="kicker"><span id="stopIdx"></span> · <span id="stopMeta"></span></p>
      <h2 id="stopName"></h2>
      <p class="blurb" id="stopBlurb"></p>
      <p class="src" id="stopSrc" hidden></p>
      <p class="why" id="stopWhy" hidden></p>
      <div class="actions">
        <button class="act no" id="noBtn" title="Skip — not for me">✕<small>Skip</small></button>
        <button class="act cam" id="camBtn" title="Snap &amp; post">📷</button>
        <button class="act yes" id="yesBtn" title="Go — I like this">○<small>Go</small></button>
      </div>
    </div>
  </section>

  <!-- the course's places, in walking order -->
  <aside class="side" id="sidebar">
    <div class="side-head">
      <button class="side-fold" id="sideFold" title="Hide list">›</button>
      <span id="sideTitle">—</span>
      <span class="side-count" id="sideCount">0</span>
    </div>
    <div class="side-list" id="sideList"></div>
    <p class="hint side-note">Routes are worked out by the FOSSGIS routing server: the start and stop coordinates of your walk are sent there.</p>
  </aside>
  <button class="side-open" id="sideOpen" title="Show list" hidden>‹ Spots</button>

  <div class="bottom" id="bottom">
    <div class="course-bar" id="courseBar"></div>
    <div class="dock">
      <button class="btn primary" id="startBtn" disabled>▶ Start Walk</button>
      <button class="btn" id="pauseBtn" disabled>Pause</button>
      <button class="btn" id="prevBtn" disabled title="Replay what the guide just said">‹ Prev</button>
      <button class="btn" id="nextBtn" disabled title="Skip ahead to the next stop">Next ›</button>
      <button class="btn mob-only" id="listBtn" title="Places on this walk">📋</button>
      <button class="btn" id="snapBtn" title="Snap a photo">📷</button>
      <button class="btn" id="resetBtn" title="Back to the start">↺</button>
    </div>
  </div>

  <!-- snap & post -->
  <div class="modal" id="post" hidden>
    <div class="post-card">
      <img id="postImg" alt="Your photo" />
      <label class="post-label" for="postText">Caption</label>
      <textarea id="postText" rows="5"></textarea>
      <p class="hint" id="postHint"></p>
      <button class="primary" id="shareBtn">Share to Instagram</button>
      <div class="row">
        <button class="link" id="copyBtn">Copy caption</button>
        <button class="link" id="saveBtn">Save photo</button>
        <button class="link" id="postClose">Close</button>
      </div>
    </div>
  </div>

  <input type="file" id="camInput" accept="image/*" capture="environment" hidden />
  <div class="toast" id="toast"></div>

  <div class="overlay" id="overlay">
    <div class="brand">TasteWalk</div>
    <p id="overlayMsg">Loading the map…</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "maplibre-gl": "https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.mjs",
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>

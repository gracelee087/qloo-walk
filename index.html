<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TasteWalk — Walking Guide That Learns Your Taste</title>
  <meta name="description" content="A walking guide that learns your taste as you walk: tap yes or no on each place, snap a photo and post it straight to Instagram." />
  <meta name="theme-color" content="#f6f1e7" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👟</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="map"></div>

  <header class="top">
    <div class="brand">TasteWalk</div>
    <div class="top-right">
      <span class="chip" id="envChip">—</span>
      <div class="mode" id="modeToggle" role="tablist">
        <button data-mode="sim" class="on" title="Simulated walk">Demo</button>
        <button data-mode="gps" title="Use your real location">GPS</button>
      </div>
    </div>
  </header>

  <button class="recenter" id="recenterBtn" title="Follow me" hidden>◎</button>

  <section class="sheet" id="sheet">
    <div class="grip"></div>

    <!-- 1. choose a walk -->
    <div class="view" id="viewPick">
      <p class="kicker" id="areaName"></p>
      <h1>Pick a walk</h1>
      <div class="courses" id="courses"></div>
    </div>

    <!-- 2. walking -->
    <div class="view" id="viewWalk" hidden>
      <p class="kicker"><span id="stopIdx"></span> · <span id="stopMeta"></span></p>
      <h2 id="stopName"></h2>
      <p class="blurb" id="stopBlurb"></p>
      <p class="why" id="stopWhy" hidden></p>
      <div class="actions">
        <button class="act no" id="noBtn" title="Not for me">✕</button>
        <button class="act cam" id="camBtn" title="Snap &amp; post">📷</button>
        <button class="act yes" id="yesBtn" title="I like this">○</button>
      </div>
      <div class="controls">
        <button class="link" id="pauseBtn">Pause</button>
        <button class="link" id="endBtn">End walk</button>
      </div>
    </div>
  </section>

  <!-- snap & post -->
  <div class="modal" id="post" hidden>
    <div class="post-card">
      <img id="postImg" alt="Your photo" />
      <label class="post-label" for="postText">Caption</label>
      <textarea id="postText" rows="5"></textarea>
      <p class="hint" id="postHint"></p>
      <button class="primary" id="shareBtn">Share to Instagram</button>
      <div class="row">
        <button class="link" id="copyBtn">Copy caption</button>
        <button class="link" id="saveBtn">Save photo</button>
        <button class="link" id="postClose">Close</button>
      </div>
    </div>
  </div>

  <input type="file" id="camInput" accept="image/*" capture="environment" hidden />
  <div class="toast" id="toast"></div>

  <div class="overlay" id="overlay">
    <div class="brand">TasteWalk</div>
    <p id="overlayMsg">Loading the map…</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet-src.esm.js"
    }
  }
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
